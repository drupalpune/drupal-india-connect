<!-- @dsCard group="Event site" viewport="1400x900" name="Event site" subtitle="Home, speakers, schedule and sponsors — click through" -->
<!-- @startingPoint section="Event site" subtitle="Full event marketing site, four screens" viewport="1400x900" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DrupalAsia Connect — event site UI kit</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); }
  a { color: var(--color--primary-50); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script>
  // The compiler namespaces the bundle; find it by looking for known exports.
  window.DS = Object.values(window).find(
    (v) => v && typeof v === 'object' && v.SiteHero25 && v.Section && v.Countdown
  ) || {};
  window.Screens = {};
</script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Speakers.jsx"></script>
<script type="text/babel" src="Schedule.jsx"></script>
<script type="text/babel" src="Sponsors.jsx"></script>
<script type="text/babel">
  const { Shell, Home, Speakers, Schedule, Sponsors } = window.Screens;
  const SCREENS = { home: Home, speakers: Speakers, schedule: Schedule, sponsors: Sponsors };

  function App() {
    const [screen, setScreen] = React.useState('home');
    const Current = SCREENS[screen] || Home;
    React.useEffect(() => { window.scrollTo(0, 0); }, [screen]);
    return (
      <Shell current={screen} onNavigate={setScreen}>
        <Current />
      </Shell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
