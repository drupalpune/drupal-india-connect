<!-- @dsCard group="Type" viewport="700x220" name="Display scale" subtitle="General Sans 700, uppercase, tight leading" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Display</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div>
  <div style="font-size:clamp(2rem,6vw,4rem);font-weight:700;line-height:0.86;text-transform:uppercase;letter-spacing:0.01em;color:var(--dac-navy)">Hero display</div>
  <div class="val">--type-hero / --type-display · lh 0.86 · ls 0.01em · uppercase</div>
  <div style="font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700;line-height:1.05;text-transform:uppercase;letter-spacing:0.01em;margin-top:12px;color:var(--dac-navy)">Section heading</div>
  <div class="val">--type-h2 · clamp(2.25rem, 1.5rem + 2vw, 3.5rem) · lh 1.05</div>
</div>
</body>
</html>
