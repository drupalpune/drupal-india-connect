<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Container</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div>
  <div class="val">--layout--max-width: 87.5rem (1400px) · padding-inline 1–2rem</div>
  <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:10px">
    <div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div><div style="height:40px;background:var(--color--sky-94);border-radius:2px"></div>
  </div>
  <div class="val" style="margin-top:8px">6 columns &lt;600px · 12 columns ≥600px · 14 columns ≥1300px</div>
</div>
</body>
</html>
