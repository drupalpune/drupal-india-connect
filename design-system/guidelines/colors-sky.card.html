<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sky</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background: var(--color--sky-50)"></div><div class="name">sky-50</div><div class="val"></div></div>
  <div class="sw"><div class="chip" style="background: var(--color--sky-80)"></div><div class="name">sky-80</div><div class="val"></div></div>
  <div class="sw"><div class="chip" style="background: var(--color--sky-86)"></div><div class="name">sky-86</div><div class="val">sponsor tile</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--sky-90)"></div><div class="name">sky-90</div><div class="val"></div></div>
  <div class="sw"><div class="chip" style="background: var(--color--sky-94)"></div><div class="name">sky-94</div><div class="val">accent band</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--sky-97)"></div><div class="name">sky-97</div><div class="val">nav hover</div></div>
</div>
</body>
</html>
