<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Primary ramp</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background: var(--color--primary-30)"></div><div class="name">primary-30</div><div class="val">very dark</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--primary-40)"></div><div class="name">primary-40</div><div class="val">hover</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--primary-50)"></div><div class="name">primary-50</div><div class="val">base #0462D1</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--primary-60)"></div><div class="name">primary-60</div><div class="val">bright</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--primary-80)"></div><div class="name">primary-80</div><div class="val">very bright</div></div>
</div>
</body>
</html>
