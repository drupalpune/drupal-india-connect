<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>On dark</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div style="background:var(--surface-band-dark);padding:16px;border-radius:4px">
  <div style="color:#fff;font-size:20px;font-weight:700">White — headings and figures</div>
  <div style="color:var(--text-on-dark-body);font-size:15px;margin-top:6px">Light blue-grey — body copy on dark bands</div>
  <div style="color:var(--text-on-dark-accent);font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;margin-top:6px">Pale blue — eyebrows and dates</div>
</div>
</body>
</html>
