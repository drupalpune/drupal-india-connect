<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="One 16px-anchored scale — no ad-hoc values" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp0-25</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp0-25)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp0-5</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp0-5)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp0-75</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp0-75)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp1</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp1)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp1-5</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp1-5)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp2</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp2)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp2-5</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp2-5)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp3</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp3)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp4</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp4)"></span></div>
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:3px"><span class="val" style="width:64px">--sp5</span><span style="height:8px;background:var(--color--primary-50);width:var(--sp5)"></span></div>
</div>
</body>
</html>
