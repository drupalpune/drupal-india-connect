<!-- @dsCard group="Brand" viewport="700x170" name="Image placeholders" subtitle="Striped fill + mono label until real assets land" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Placeholders</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:flex;gap:12px">
  <div style="position:relative;width:210px;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#fff 0 12px,#F1F7FE 12px 24px);border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center">
    <span style="font-family:var(--font-mono);font-size:11px;background:#fff;border:1px solid var(--border-hairline);padding:5px 8px">venue photo / 4:3</span>
  </div>
  <div style="position:relative;width:150px;aspect-ratio:1;background:repeating-linear-gradient(135deg,#EAF4FE 0 12px,#DCEBFB 12px 24px)">
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(246,110,14,0.28),rgba(4,98,209,0.42))"></div>
  </div>
</div>
</body>
</html>
