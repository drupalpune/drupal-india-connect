<!-- @dsCard group="Colors" viewport="700x150" name="Night (neutrals)" subtitle="Cool, slightly blue — never pure grey" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Night</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background: var(--color--night-5)"></div><div class="name">night-5</div><div class="val">body text</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--night-20)"></div><div class="name">night-20</div><div class="val"></div></div>
  <div class="sw"><div class="chip" style="background: var(--color--night-30)"></div><div class="name">night-30</div><div class="val">muted body</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--night-40)"></div><div class="name">night-40</div><div class="val">captions</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--night-70)"></div><div class="name">night-70</div><div class="val"></div></div>
  <div class="sw"><div class="chip" style="background: var(--color--night-90)"></div><div class="name">night-90</div><div class="val">hairlines</div></div>
</div>
</body>
</html>
