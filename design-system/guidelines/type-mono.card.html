<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mono</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div>
  <span style="font-family:var(--font-mono);font-size:0.8125rem;letter-spacing:0.04em;background:#fff;border:1px solid var(--border-hairline);padding:8px 12px">venue photo or map / 4:3</span>
  <div class="val" style="margin-top:10px">Used inside striped placeholders to say what belongs there.</div>
</div>
</body>
</html>
