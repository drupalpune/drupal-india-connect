<!-- @dsCard group="Colors" viewport="700x140" name="Secondary ramp" subtitle="Derived from the logo orange — hsl(25, 93%, 51%)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Secondary ramp</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background: var(--color--secondary-30)"></div><div class="name">secondary-30</div><div class="val">very dark</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--secondary-40)"></div><div class="name">secondary-40</div><div class="val">hover</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--secondary-50)"></div><div class="name">secondary-50</div><div class="val">base #F66E0E</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--secondary-60)"></div><div class="name">secondary-60</div><div class="val">bright</div></div>
  <div class="sw"><div class="chip" style="background: var(--color--secondary-80)"></div><div class="name">secondary-80</div><div class="val">very bright</div></div>
</div>
</body>
</html>
