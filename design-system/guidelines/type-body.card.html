<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Body</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>

<body>
<div>
  <div style="font-size:1.25rem;line-height:1.5;max-width:52ch">lg — 1.125 / 1.25 / 1.5rem. Ledes and intro copy.</div>
  <div style="font-size:1.0625rem;line-height:1.55;max-width:60ch;margin-top:8px;color:var(--text-body)">normal — 1 / 1.125 / 1.25rem. Body copy, text-wrap: pretty.</div>
  <div style="font-size:0.875rem;line-height:1.5;margin-top:8px;color:var(--text-muted)">sm — 0.875rem. Captions, stat descriptions, utility bar.</div>
