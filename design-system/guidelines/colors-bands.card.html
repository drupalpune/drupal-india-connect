<!-- @dsCard group="Colors" viewport="700x190" name="Band palette in use" subtitle="Max two band colours per page" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bands</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:grid;gap:8px">
  <div style="background:var(--surface-page);border:1px solid var(--border-hairline);padding:14px;border-radius:4px">White — default sections</div>
  <div style="background:var(--surface-band-tint);padding:14px;border-radius:4px">Tint — alternating light band (accent)</div>
  <div style="background:var(--surface-band-dark);color:#fff;padding:14px;border-radius:4px">Navy — countdown, CFP, news, footer</div>
  <div style="background:var(--color--secondary-50);color:#fff;padding:14px;border-radius:4px">Orange — one high-emphasis CTA band only</div>
</div>
</body>
</html>
