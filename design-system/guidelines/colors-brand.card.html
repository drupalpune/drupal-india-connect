<!-- @dsCard group="Colors" viewport="700x140" name="Brand extras" subtitle="Logo navy and the tinted band, used for page bands" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand extras</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background: var(--dac-navy)"></div><div class="name">navy</div><div class="val">#0C2152</div></div>
  <div class="sw"><div class="chip" style="background: var(--dac-sky-tint)"></div><div class="name">sky tint</div><div class="val">#EAF4FE</div></div>
  <div class="sw"><div class="chip" style="background: var(--surface-page)"></div><div class="name">page</div><div class="val">#FDFDFD</div></div>
  <div class="sw"><div class="chip" style="background: var(--surface-card)"></div><div class="name">card</div><div class="val">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background: var(--border-hairline)"></div><div class="name">hairline</div><div class="val">borders</div></div>
</div>
</body>
</html>
