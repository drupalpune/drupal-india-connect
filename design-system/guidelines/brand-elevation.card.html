<!-- @dsCard group="Brand" viewport="700x170" name="Elevation & hover" subtitle="One shadow; hover is scale or colour, never lift" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Elevation</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
  <div style="width:200px;padding:14px;border-radius:12px;background:#fff;box-shadow:var(--shadow-card);border:1px solid var(--color--night-80)">Framed card — the system's only shadow</div>
  <div style="width:180px;padding:14px;border-radius:12px;background:#fff;border:1px solid var(--border-hairline);transform:scale(1.02)">Clickable card hover — scale 1.02</div>
</div>
<div class="val" style="margin-top:10px">Transitions 0.2s (colour) / 0.3s (transform), plain ease. No bounce.</div>
</body>
</html>
