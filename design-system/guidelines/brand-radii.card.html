<!-- @dsCard group="Brand" viewport="700x160" name="Radii & rules" subtitle="Small UI nearly square; cards generous" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Radii</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--color--sky-94);border-radius:var(--radius-sm)"></div><div class="name">4px</div><div class="val">badges</div></div>
  <div class="sw"><div class="chip" style="background:var(--color--sky-94);border-radius:var(--radius-md)"></div><div class="name">6px</div><div class="val">buttons, inputs</div></div>
  <div class="sw"><div class="chip" style="background:var(--color--sky-94);border-radius:var(--radius-lg)"></div><div class="name">8px</div><div class="val">panels</div></div>
  <div class="sw"><div class="chip" style="background:var(--color--sky-94);border-radius:var(--radius-xl)"></div><div class="name">12px</div><div class="val">cards</div></div>
  <div class="sw"><div class="chip" style="background:var(--color--sky-94);border-radius:var(--radius-2xl)"></div><div class="name">24px</div><div class="val">tiles</div></div>
</div>
<div class="val" style="margin-top:10px">Rules: 1px hairline · 2px control border · 3px card accent · 4px heading rule</div>
</body>
</html>
