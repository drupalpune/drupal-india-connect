<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Logo</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
  <img src="../assets/logo.svg" alt="DrupalAsia Connect" style="height:72px;width:auto" />
  <div style="background:var(--surface-band-dark);padding:10px;border-radius:4px"><img src="../assets/logo.svg" alt="DrupalAsia Connect" style="height:44px;width:auto;background:#fff;padding:6px;border-radius:3px" /></div>
</div>
<div class="val" style="margin-top:10px">The SVG carries a white canvas — on dark bands place it on a white plate.</div>
</body>
</html>
