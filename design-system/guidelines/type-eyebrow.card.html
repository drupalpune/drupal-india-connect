<!-- @dsCard group="Type" viewport="700x170" name="Eyebrows & labels" subtitle="The system's signature small type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Eyebrows</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface-page); font-family: var(--font-sans); color: var(--color--night-5); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { width: 96px; }
  .chip { height: 52px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; margin-top: 6px; }
  .val { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }
  .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
</style>
</head>
<body>
<div>
  <div style="display:flex;align-items:center;gap:12px"><span style="width:32px;height:2px;background:var(--color--secondary-50)"></span><span style="font-size:0.75rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--color--secondary-50)">Section eyebrow — rule + 0.16em</span></div>
  <div style="margin-top:14px;padding-left:1.25rem;border-left:4px solid var(--color--primary-50);font-size:0.75rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase">Accented heading — 4px primary rule</div>
  <div style="margin-top:14px;font-size:0.75rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted)">Field label — 0.14em</div>
</div>
</body>
</html>
