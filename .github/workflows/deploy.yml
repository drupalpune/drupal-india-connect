name: Deploy to staging

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            export PATH="/opt/alt/php84/usr/bin:$PATH"
            export COMPOSER_PROCESS_TIMEOUT=1800

            # Preserve any server-only tracked-file edits (e.g. the staging
            # Basic Auth block in web/.htaccess) across the pull.
            STASHED=0
            if ! git diff --quiet; then
              git stash push -m "pre-deploy-$(date +%s)"
              STASHED=1
            fi

            git fetch origin main
            git merge --ff-only origin/main

            if [ "$STASHED" -eq 1 ]; then
              git stash pop
            fi

            composer install --no-dev --optimize-autoloader --no-interaction

            vendor/bin/drush updb -y
            vendor/bin/drush cim -y
            vendor/bin/drush cr

            echo "Deploy complete: $(git rev-parse --short HEAD)"
