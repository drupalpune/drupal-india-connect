data: '{"id":"process_session_moderated","version":"1.0.0","metadata":{"label":"Session Moderated","documentation":"","executable":true,"tags":["Sessions"],"changelog":"","id":"process_session_moderated","version":"1.0.0","storage":"","template":false},"nodes":[{"id":"Event_17jybve","componentType":1,"plugin":"content_entity:update","label":"Session entity updated","position":{"x":1192,"y":42},"configuration":{"type":"node session"},"annotation":""},{"id":"Activity_00cv6t2","componentType":4,"plugin":"eca_token_load_entity","label":"Load entity''s old values","position":{"x":1191,"y":206},"configuration":{"token_name":"originalentity","from":"current","entity_type":"_none","entity_id":"","revision_id":"","properties":"","langcode":"_interface","latest_revision":false,"unchanged":true,"object":""},"annotation":""},{"id":"Activity_0xfxpxt","componentType":4,"plugin":"eca_token_load_entity","label":"Load entity''s new values","position":{"x":815,"y":421},"configuration":{"token_name":"updatedentity","from":"current","entity_type":"_none","entity_id":"","revision_id":"","properties":"","langcode":"_interface","latest_revision":false,"unchanged":false,"object":""},"annotation":""},{"id":"Activity_1b8cbnk","componentType":4,"plugin":"action_send_email_action","label":"Send acceptance email","position":{"x":811,"y":895},"configuration":{"recipient":"[node:author:mail]","subject":"🎉 [node:title] Session Accepted at [config_page:event_details:field_event_name] [config_page:event_details:field_event_year]","message":"Hello,\n\nCongratulations! Your \"[node:title]\" session ([node:url]) was successfully accepted to [config_page:event_details:field_event_name] [config_page:event_details:field_event_year]! Note that this email only goes to the author of the node, so please inform any additional speakers for this session.\n\nTo confirm that you ARE able to present this session, please click the following link:\n[node:moderation-link:published]\n\nConversely, if you are NOT able to present your session, please decline your session by clicking this link:\n[node:moderation-link:declined]\n\nPlease let us know before [config_page:event_details:field_current:entity:field_session_confirmation:date:custom:l, F j|\"we have to give your spot to someone else\"].\n\nIf you have questions or want to discuss this further, please reply to this email. You can find a speaker FAQ including important dates is available at [site:url]speaker-info.\n\nThanks again,\n\nThe [config_page:event_details:field_event_name] planning team","replace_tokens":true},"annotation":""},{"id":"Activity_0k76xfu","componentType":4,"plugin":"action_send_email_action","label":"Send rejection email","position":{"x":1203,"y":895},"configuration":{"recipient":"[node:author:mail]","subject":"[config_page:event_details:field_event_name] Session, [node:title]","message":"On behalf of our team, THANK YOU for submitting your \"[node:title]\" session to [config_page:event_details:field_event_name] [config_page:event_details:field_event_year]. We are beyond grateful and appreciative.\n\nUnfortunately, we could not accept all of the excellent sessions that were submitted, and this session did not make this year''s cut.\n\nNevertheless, we still hope to see you in [config_page:event_details:field_event_location_short] this year. Please reach out and let us know if you have any questions.\n\nThanks again,\n\nThe [config_page:event_details:field_event_name] planning team","replace_tokens":true},"annotation":""},{"id":"Activity_0ptj9ye","componentType":4,"plugin":"action_message_action","label":"Display message","position":{"x":810,"y":1087},"configuration":{"replace_tokens":false,"message":"Acceptance email has been sent to the author of the session."},"annotation":""},{"id":"Activity_1cr12zx","componentType":4,"plugin":"action_message_action","label":"Display message","position":{"x":1206,"y":1084},"configuration":{"replace_tokens":false,"message":"Rejection email has been sent to the author of the session."},"annotation":""},{"id":"Activity_054ec8a","componentType":4,"plugin":"action_send_email_action","label":"Send waitlist email","position":{"x":1436,"y":663},"configuration":{"recipient":"[node:author:mail]","subject":"[config_page:event_details:field_event_name] Session, [node:title]","message":"On behalf of our team, THANK YOU for submitting your \"[node:title]\" session to [config_page:event_details:field_event_name] [config_page:event_details:field_event_year]. We are beyond grateful and appreciative.\n\nUnfortunately, we had to decline many great proposals — but we liked yours so much that we couldn’t let it go completely.\n\nWhile we cannot confirm your spot just yet, we’ve placed your session on the waitlist in hopes that we can find a way to include it. If a spot opens up, we’ll reach out as soon as possible!\n\nPlease inform us if you wish to remain on the waitlist up until the day of the event. Feel free to reach out with any questions.\n\nNevertheless, we still hope to see you in [config_page:event_details:field_event_location_short] this year. Please reach out and let us know if you have any questions.\n\nThanks again,\n\nThe [config_page:event_details:field_event_name] planning team","replace_tokens":true},"annotation":""},{"id":"Activity_1jjhoas","componentType":4,"plugin":"action_message_action","label":"Display message","position":{"x":1437,"y":809},"configuration":{"replace_tokens":false,"message":"Waitlist email has been sent to the author of the session."},"annotation":""},{"id":"Activity_1mbs8yr","componentType":4,"plugin":"eca_token_load_entity","label":"Load entity''s new values","position":{"x":2203,"y":609},"configuration":{"token_name":"updatedentity","from":"current","entity_type":"_none","entity_id":"","revision_id":"","properties":"","langcode":"_interface","latest_revision":false,"unchanged":false,"object":""},"annotation":""},{"id":"Activity_1v73an9","componentType":4,"plugin":"action_send_email_action","label":"Send acceptance email","position":{"x":2204,"y":872},"configuration":{"recipient":"[node:author:mail]","subject":"🎉 [node:title] Session Accepted at [config_page:event_details:field_event_name] [config_page:event_details:field_event_year]","message":"Hello,\n\nCongratulations! Your \"[node:title]\" waitlisted session ([node:url]) was successfully accepted to [config_page:event_details:field_event_name] [config_page:event_details:field_event_year]! Note that this email only goes to the author of the node, so please inform any additional speakers for this session.\n\nPlease reply to this email indicating that you are are able to do this session in person. You can find a speaker FAQ including important dates is available at [site:url]speaker-info. Reply to this email if you have any additional questions.\n\nThanks again,\n\nThe [config_page:event_details:field_event_name] planning team","replace_tokens":true},"annotation":""},{"id":"Activity_0eheffa","componentType":4,"plugin":"action_message_action","label":"Display message","position":{"x":2203,"y":1039},"configuration":{"replace_tokens":false,"message":"Acceptance email has been sent to the author of the session."},"annotation":""},{"id":"Activity_18r2swy","componentType":4,"plugin":"eca_token_load_entity","label":"Load entity''s new values","position":{"x":1681,"y":904},"configuration":{"token_name":"updatedentity","from":"current","entity_type":"_none","entity_id":"","revision_id":"","properties":"","langcode":"_interface","latest_revision":false,"unchanged":false,"object":""},"annotation":""},{"id":"Activity_1yekubf","componentType":4,"plugin":"eca_set_field_value","label":"Clear room","position":{"x":1519,"y":1170},"configuration":{"field_name":"field_r","field_value":"","method":"set:clear","strip_tags":false,"trim":false,"save_entity":false,"object":"updatedentity"},"annotation":""},{"id":"Activity_0ey4hfy","componentType":4,"plugin":"eca_set_field_value","label":"Clear time slot and save","position":{"x":1520,"y":1337}