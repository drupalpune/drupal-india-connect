'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Hero Banner'
description: 'A light, editorial-style hero with a small kicker, a three-line two-tone title, a date/location row, two CTA buttons, and a square media panel on the side.'
group: Drupal Connect
status: stable
props:
  type: object
  properties:
    kicker:
      type: string
      title: 'Kicker label'
      description: 'Small uppercase label shown above the title, e.g. "The first pan-Asia Drupal event".'
      examples:
        - 'The first pan-Asia Drupal event'
    title_top:
      type: string
      title: 'Title — line 1'
      description: 'First line of the title, shown in the dark color.'
      examples:
        - DrupalAsia
    title_highlight:
      type: string
      title: 'Title — highlighted line'
      description: 'Second line of the title, shown in the accent color.'
      examples:
        - Connect
    title_bottom:
      type: string
      title: 'Title — line 3'
      description: 'Third line of the title, shown in the dark color.'
      examples:
        - '2027'
    description:
      type: string
      title: Description
      description: 'Supporting text shown beneath the title.'
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>Three days of sessions, workshops, contribution sprints and hallway conversations — bringing together the makers, agencies and organisations building Drupal across Asia.</p>'
    date:
      type: string
      title: Date
      description: 'Shown under a "Dates" label.'
      examples:
        - '18–20 January 2027'
    location:
      type: string
      title: Location
      description: 'Shown under a "Location" label.'
      examples:
        - 'Asia — city to be announced'
    cta_primary_label:
      type: string
      title: 'Primary button label'
      examples:
        - 'Get event updates'
    cta_primary_url:
      type: string
      title: 'Primary button link'
      format: uri-reference
      examples:
        - /updates
    cta_secondary_label:
      type: string
      title: 'Secondary button label'
      examples:
        - 'Plan to speak'
    cta_secondary_url:
      type: string
      title: 'Secondary button link'
      format: uri-reference
      examples:
        - /call-for-sessions
    video_url:
      type: string
      title: 'Video embed URL'
      description: 'Optional embeddable video URL (e.g. a YouTube/Vimeo embed link) shown in the square media panel. Takes priority over the image below when both are set.'
      format: uri-reference
    image:
      $ref: json-schema-definitions://canvas.module/image
      title: 'Media image'
      description: 'Used only if no video embed URL is set above.'
      type: object
    media_caption:
      type: string
      title: 'Media caption'
      description: 'Optional small caption tag shown over the bottom-left corner of the media panel, e.g. "Event teaser video".'
      examples:
        - 'Event teaser video'
