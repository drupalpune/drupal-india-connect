'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Venue & Location'
description: 'A two-column venue section: name, address, description and a directions button on one side, a map embed or image on the other.'
group: Drupal Connect
status: stable
props:
  type: object
  required:
    - venue_name
  properties:
    label:
      type: string
      title: 'Label (pill)'
      description: 'Optional small pill shown above the venue name.'
      default: Venue
      examples:
        - Venue
    venue_name:
      type: string
      title: 'Venue name'
      examples:
        - 'Indian Institute of Technology, Bombay'
    address:
      type: string
      title: Address
      examples:
        - 'IIT Area, Powai, Mumbai, Maharashtra 400076'
    description:
      type: string
      title: Description
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - "<p>Set on the IIT Bombay campus in Powai, with easy access from Mumbai's domestic and international airports.</p>"
    map_embed_url:
      type: string
      title: 'Map embed URL'
      description: 'On Google Maps: Share > "Embed a map" tab (not "Send a link") > copy only the URL inside src="...", starting with https://www.google.com/maps/embed. Do not use a maps.app.goo.gl share link or the full <iframe> tag - Google blocks share links from being embedded. Takes priority over the image below when both are set.'
      format: uri-reference
      examples:
        - 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3769.4437044437464!2d72.91115947520676!3d19.132045482084123!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7c7f189efc039%3A0x68fdcea4c5c5894e!2sIndian%20Institute%20of%20Technology%20Bombay!5e0!3m2!1sen!2sin!4v1786621902459!5m2!1sen!2sin'
    image:
      $ref: json-schema-definitions://canvas.module/image
      title: 'Venue image'
      description: 'Used only if no map embed URL is set above.'
      type: object
    cta_label:
      type: string
      title: 'Button label'
      examples:
        - 'Get Directions'
    cta_url:
      type: string
      title: 'Button link'
      format: uri-reference
      examples:
        - 'https://maps.app.goo.gl/9YENwPB4UySgwoxRA'
