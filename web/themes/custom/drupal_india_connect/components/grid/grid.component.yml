'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Grid
description: 'A responsive grid layout with a configurable number of columns and gap between items.'
group: Drupal Connect
status: stable
props:
  type: object
  required:
    - columns
  properties:
    columns:
      type: number
      title: 'Number of columns'
      description: '1 column stacks the items at every width, e.g. a list of full-width cards.'
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      meta:enum:
        1: '1 column'
        2: '2 columns'
        3: '3 columns'
        4: '4 columns'
        5: '5 columns'
        6: '6 columns'
      default: 3
      examples:
        - 3
    gap:
      type: string
      title: 'Spacing (px)'
      description: 'Gap between grid items, in pixels (e.g. "24"). Defaults to 24px if left blank.'
      default: '24'
      examples:
        - '24'
    tablet_columns:
      type: string
      title: 'Columns on tablet'
      description: 'Optional. Columns from 500px to 999px wide. "auto" keeps the usual step-up (2, then 3 from 700px). Use "2" so four items never leave one alone on a row, or "1" to stack items that each need room, such as a panel beside a nested grid.'
      enum:
        - auto
        - '1'
        - '2'
      meta:enum:
        auto: 'Auto (default)'
        '1': '1 column'
        '2': '2 columns'
      default: auto
      examples:
        - auto
    center_last_item:
      type: boolean
      title: 'Centre a lone last item'
      description: 'Optional, 2-column grids. When the item count is odd, centre the last item on its row at the same width as the others, instead of leaving it on the left.'
      default: false
    variant:
      type: string
      title: 'Variant'
      description: 'Optional. Restyles the cards inside the grid. "Panel" joins Fact rows (inline, on-dark) into one translucent list, e.g. a session''s details beside the hero. "Joined" sets Info Cards side by side as one panel, with an arrow (a sequence) or a plus (connected parts) between them; the pill becomes a large role word. "Steps" turns Info Cards into numbered steps on a line (navy bands). "List" turns Info Cards into numbered rows on hairlines, e.g. a list of questions. "Seats" sets a People Card beside Info Cards drawn as dashed placeholder places, e.g. a moderator and panelists still to be announced.'
      enum:
        - default
        - panel
        - joined-arrow
        - joined-plus
        - steps
        - list
        - seats
      meta:enum:
        default: 'Default'
        panel: 'Panel (fact list)'
        joined-arrow: 'Joined, arrows (sequence)'
        joined-plus: 'Joined, plus (connected parts)'
        steps: 'Steps on a line'
        list: 'Numbered list'
        seats: 'Seats (people and placeholders)'
      default: default
      examples:
        - default
slots:
  grid_slot:
    title: 'Grid items'
