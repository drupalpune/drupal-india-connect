'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Countdown Timer
description: 'A live countdown (days/minutes/seconds) to a target date and time, with an optional label and expired message.'
group: Drupal Connect
status: stable
# countdown-timer.js is auto-attached by SDC but uses the `Drupal` and
# `once` globals, which SDC does not depend on by default. Declare them
# explicitly rather than relying on another library happening to load them.
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
props:
  type: object
  required:
    - target_datetime
  properties:
    label:
      type: string
      title: Label
      examples:
        - 'React India 2026 starts in'
    target_datetime:
      type: string
      title: 'Target date & time'
      description: 'The date and time to count down to.'
      format: date-time
      examples:
        - '2026-10-29T09:00:00+05:30'
    expired_message:
      type: string
      title: 'Expired message'
      description: 'Shown once the target date has passed.'
      examples:
        - "We're live!"
