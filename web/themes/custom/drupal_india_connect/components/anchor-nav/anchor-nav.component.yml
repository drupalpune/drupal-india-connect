$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Jump links'
description: 'A row of links to sections further down the same page, under a hairline rule, e.g. the sponsor tiers under the hero. Up to ten links; a link shows only when both its label and its anchor are filled in. Anchors are ids without the #, such as a Sponsor group''s Anchor.'
group: 'Drupal Connect'
props:
  type: object
  properties:
    label:
      title: 'Accessible name'
      description: 'Read out by screen readers for this list of links.'
      type: string
      examples:
        - 'On this page'
    link_1_label:
      title: 'Link 1 label'
      type: string
      examples:
        - 'Diamond'
    link_1_anchor:
      title: 'Link 1 anchor'
      type: string
      examples:
        - 'diamond'
    link_2_label:
      title: 'Link 2 label'
      type: string
