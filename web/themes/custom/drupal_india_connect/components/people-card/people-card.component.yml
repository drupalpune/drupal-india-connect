'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'People Card'
description: 'A person''s photo, name, designation, an optional domain, rich-text description and session title, and optional Drupal.org and LinkedIn profile links. With a speaker page URL the photo and name link to it and the description is cut to 3 lines. The keynote card style is a larger card: a big square photo beside the text when the card is wide, stacked when it is narrow.'
group: Drupal Connect
status: stable
props:
  type: object
  required:
    - name
  properties:
    card_style:
      type: string
      title: 'Card style'
      description: 'Optional. Keynote: a larger card for a keynote speaker, with a big square photo beside the text once the card is wide enough (one per row), stacked in a row of two or three.'
      enum:
        - default
        - keynote
      meta:enum:
        default: Default
        keynote: Keynote
      default: default
      examples:
        - default
    badge:
      type: string
      title: Badge
      description: 'Optional small label above the name, e.g. "Keynote".'
    avatar:
      $ref: json-schema-definitions://canvas.module/image
      title: Avatar
      type: object
    name:
      type: string
      title: Name
      examples:
        - 'Dries Buytaert'
    designation:
      type: string
      title: Designation
      description: 'Job title, role, or affiliation.'
      examples:
        - 'Founder & Project Lead, Drupal'
    description:
      type: string
      title: Description
      description: 'Optional supporting text about this person.'
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>Dries founded the Drupal project in 2001 and continues to lead its direction today.</p>'
    domain:
      type: string
      title: Domain
      description: 'Area the speaker will address (shown as ''Speaking on'')'
      examples:
        - 'Drupal Core'
    session_title:
      type: string
      title: 'Session title'
      description: 'Optional confirmed session title.'
      examples:
        - 'The State of Drupal'
    session_description:
      type: string
      title: 'Session teaser'
      description: 'Optional. One or two sentences under the session title. Only used when a session title is set.'
    session_url:
      type: string
      title: 'Session page URL'
      description: 'Optional. Links the session title to its page. Only used when a session title is set.'
      format: uri-reference
    speaker_url:
      type: string
      title: 'Speaker page URL'
      description: 'Optional. Links the photo and name to the full speaker profile, and shortens the description to 3 lines.'
      format: uri-reference
    cta_label:
      type: string
      title: 'Speaker page link text'
      description: 'Optional. Adds a text link to the speaker page under the card, e.g. "Read the abstract". Only used with a speaker page URL.'
    drupal_url:
      type: string
      title: 'Drupal.org profile URL'
      format: uri-reference
      examples:
        - 'https://www.drupal.org/u/dries'
    linkedin_url:
      type: string
      title: 'LinkedIn profile URL'
      format: uri-reference
      examples:
        - 'https://www.linkedin.com/in/dries'
