'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Milestone Row'
description: 'One row of a Milestone Table: a name, a description, optional Time Commitment / Ticket Details text, and Opens / Closes / Key Date-Outcome text. All free-text fields are rendered exactly as given — this component does not interpret, validate, or reformat dates, so values like "TBD" or "—" pass through untouched. Time Commitment and Ticket Details are optional: the cell (and its column) is omitted entirely when left blank, so set the parent Milestone Table''s matching show_time_commitment / show_ticket_details prop to keep the header in sync — and keep it consistent for every row in that table, since a row missing the field while siblings have it will misalign the column grid.'
group: Drupal Connect
status: stable
props:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      title: Name
      examples:
        - 'Call for Speakers'
    description:
      type: string
      title: Description
      pattern: '(.|\r?\n)*'
      examples:
        - "Session submissions are open to the community.\n\nWe're looking for people who enjoy reading proposals and giving feedback."
    time_commitment:
      type: string
      title: 'Time Commitment'
      examples:
        - '40–50 hours between October 2026 and January 2027'
    ticket_details:
      type: string
      title: 'Ticket Details'
      examples:
        - 'One (1) free complimentary ticket per volunteer'
    opens:
      type: string
      title: Opens
      examples:
        - '24 August'
    closes:
      type: string
      title: Closes
      examples:
        - '18 September'
    outcome:
      type: string
      title: 'Key Date / Outcome'
      examples:
        - 'Reviewer confirmations by 18 September 2026'
