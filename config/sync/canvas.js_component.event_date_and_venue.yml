js:
  original: |

    export default function EventDateVenue({
      date = "28–30 January 2027",
      days = "Thursday – Saturday",
      venue = "IIT Bombay, Powai, Mumbai, India",
      mapLabel = "View location",
      mapUrl = "https://www.google.com/maps/search/?api=1&query=IIT+Bombay+Powai",
    }) {
      // Only http(s) links: the URL is editor input and lands in an href.
      const safeMapUrl = /^https?:\/\//i.test(mapUrl || "") ? mapUrl : null;
      return (
        <section className="dac-event-details" aria-label="Event date and venue">
          <div className="dac-event-details__inner">
            <div className="dac-event-details__item">
              <div className="dac-event-details__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="5" width="18" height="16" rx="2"/>
                  <path d="M8 3v4M16 3v4M3 10h18"/>
                </svg>
              </div>
              <div className="dac-event-details__content">
                <div className="dac-event-details__title">{date}</div>
                <div className="dac-event-details__subtitle">{days}</div>
              </div>
            </div>

            <div className="dac-event-details__item">
              <div className="dac-event-details__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
                  <circle cx="12" cy="10" r="2.5"/>
                </svg>
              </div>
              <div className="dac-event-details__content">
                <div className="dac-event-details__title">{venue}</div>
                {safeMapUrl && (
              <a
                className="dac-event-details__link"
                href={safeMapUrl}
                target="_blank"
                rel="noopener noreferrer"
              >
                {mapLabel} <span aria-hidden="true">↗</span>
              </a>
            )}
              </div>
            </div>
          </div>
        </section>
      );
    }
