css:
  original: |

    /* DrupalAsia Connect — Event Date & Venue */

    .dac-event-details {
      --dac-accent: #ff7900;
      --dac-text: #101626;
      --dac-muted: #525866;

      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      font-family: inherit;
      container-type: inline-size;
    }

    .dac-event-details *,
    .dac-event-details *::before,
    .dac-event-details *::after {
      box-sizing: border-box;
    }

    /* No box, border, background or outer spacing */
    .dac-event-details__inner {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 24px;

      width: 100%;
      max-width: none;
      min-width: 0;
      margin: 0;
      padding: 0;

      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
    }

    /* Date and venue */
    .dac-event-details__item {
      display: flex;
      align-items: center;
      flex: 0 1 auto;
      min-width: 0;
      gap: 12px;

      margin: 0;
      padding: 0;
      border: 0;
    }

    .dac-event-details__item + .dac-event-details__item {
      margin: 0;
      padding: 0;
      border: 0;
    }

    /* Orange outline icons */
    .dac-event-details__icon {
      display: flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 28px;
      width: 28px;
      height: 28px;

      color: var(--dac-accent);
      background: transparent;
      border: none;
      border-radius: 0;
    }

    .dac-event-details__icon svg {
      display: block;
      width: 26px;
      height: 26px;
    }

    /* Text */
    .dac-event-details__content {
      min-width: 0;
    }

    .dac-event-details .dac-event-details__title {
      margin: 0;
      padding: 0;

      color: var(--dac-text);
      font-family: inherit;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.02em;
      text-transform: none;
      overflow-wrap: anywhere;
    }

    .dac-event-details .dac-event-details__subtitle {
      margin: 3px 0 0;
      padding: 0;

      color: var(--dac-muted);
      font-family: inherit;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      text-transform: none;
    }

    /* Location link, without auto margin */
    .dac-event-details .dac-event-details__link {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 6px;

      margin: 0;
      padding: 0;

      color: var(--dac-accent);
      font-family: inherit;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.5;
      text-decoration: none;
      white-space: nowrap;
    }

    .dac-event-details__link:hover {
      text-decoration: underline;
    }

    .dac-event-details__link:focus-visible {
      outline: 2px solid var(--dac-accent);
      outline-offset: 4px;
    }

    /* Narrow Canvas containers */
    @container (max-width: 680px) {
      .dac-event-details__inner {
        gap: 16px 24px;
      }

      .dac-event-details .dac-event-details__title {
        font-size: 18px;
      }
    }

    /* Mobile layout */
    @container (max-width: 500px) {
      .dac-event-details__inner {
        flex-direction: column;
        align-items: flex-start;
        flex-wrap: nowrap;
        gap: 16px;
      }

      .dac-event-details__item {
        width: 100%;
      }

      .dac-event-details .dac-event-details__link {
        margin: 0;
        font-size: 14px;
      }
    }
