    uuid: 3c0b0c74-7b3a-437d-a0af-fd7ec9eaa4a3
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<ul><li>Ticket access and inclusions depend on the selected ticket.</li><li>Accurate attendee information must be provided during registration.</li><li>Tickets are personal. Transfers or substitutions require organizer approval.</li><li>Activities requiring separate registration or ticket purchases are not automatically included.</li><li>Applicable taxes, processing fees, and final checkout prices follow KonfHub.</li><li>Cancellation, refunds, and changes are subject to the approved registration policy and applicable law.</li><li>All attendees must follow the <a href="/code-of-conduct">Code of Conduct</a>.</li></ul>'
        format: canvas_html_block
      text_size: normal
      text_color: default
    label: 'Text - General ticket terms'
  '0:main_slot:0:accordion_content:1:6d92aea2-c6af-4aa1-895a-2b389e12c7a1':
    parent_uuid: 43b85a54-c594-4c78-bc46-bcf07ec83f5d
