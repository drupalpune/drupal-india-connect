  '0:main_slot:0:accordion_content:1:accordion_content:0:70be3286-002f-468f-b1a9-29410c706514':
    parent_uuid: 6d92aea2-c6af-4aa1-895a-2b389e12c7a1
    slot: accordion_content
    uuid: 70be3286-002f-468f-b1a9-29410c706514
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: "<ul><li><strong>Student Pass:</strong> Valid student ID or current enrollment confirmation is required.</li><li><strong>Educator Pass:</strong> Valid faculty ID or current institutional-affiliation proof is required.</li><li>Supporting documents must be submitted <strong>during registration</strong>.</li><li>The attendee's registered name must match the supporting document.</li><li>Academia passes are non-transferable without organizer approval.</li><li>The organizing team reserves the right to verify eligibility.</li><li>Deliberate misrepresentation, forged documents, or misuse may result in registration cancellation and revocation of event access without refund, subject to applicable law.</li><li>Attendees should have a reasonable opportunity to clarify eligibility discrepancies before a final decision.</li></ul>"
        format: canvas_html_block
      text_size: normal
      text_color: default
    label: 'Text - Academia pass eligibility & verification'
