  '0:main_slot:5:group_slot:0:grid_slot:1:group_slot:2:3c9407b0-2175-4759-8667-440a272e879c':
    parent_uuid: a14f4c26-cd04-4eac-9714-e369d235cb33
    slot: group_slot
    uuid: 3c9407b0-2175-4759-8667-440a272e879c
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<p>Most of us experience AI as consumers. A new model launches, a feature appears, and we try to keep up. But nobody can follow every release—and perhaps that should not be the goal.</p><p>What if the more durable skill is learning to start with the problem? Understand the people, the context, and the constraints first. Then decide whether AI helps, what capability belongs there, how the pieces should connect, and where human judgment must remain.</p><p>This is what we mean by moving from AI consumers to AI operators and orchestrators.</p>'
        format: canvas_html_block
      text_size: normal
      text_color: default
