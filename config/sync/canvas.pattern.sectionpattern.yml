  '0:main_slot:6:group_slot:0:group_slot:2:c5a509fc-d2f3-4994-af1f-cf126c1ec9d9':
    parent_uuid: ac1b7d37-bab1-4de4-b07a-0d5cf45a4f11
    slot: group_slot
    uuid: c5a509fc-d2f3-4994-af1f-cf126c1ec9d9
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<p>We do not want the Summit to present a finished answer to what AI should become.</p><p>We want it to create a room where practitioners from different worlds can compare experiences, disagree, challenge assumptions, and discover connections that would be difficult to find inside a single ecosystem.</p><p>If people leave knowing only a few more tools, we probably have not gone far enough. We would rather they leave with a clearer view of the landscape, sharper questions, and more confidence in deciding where AI genuinely belongs in their own work.</p><p>And we hope that conversation belongs to more than people who already call themselves AI practitioners.</p><p>Whether you work in open source, public infrastructure, education, agriculture, enterprise technology, design, policy—or somewhere we have not yet considered—bring your experience, your questions, and your curiosity.</p>'
        format: canvas_html_block
      text_size: normal
      text_color: default
