    inputs:
      heading_text: 'What if different worlds shared the room?'
      level: 2
      text_size: heading-responsive-3xl
      text_color: default
      align: left
      style: default
    label: 'Heading - One Drupal community, one continent'
  '0:main_slot:3:group_slot:0:grid_slot:1:group_slot:2:c199860f-8c7d-4ae2-94f8-df4abbcffaed':
    parent_uuid: 52989457-dc53-4a5f-b123-5ec7fe56fbc1
    slot: group_slot
    uuid: c199860f-8c7d-4ae2-94f8-df4abbcffaed
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<p>Our brainstorming began reaching into government and public services, digital public infrastructure, education, agriculture, enterprise systems, language technology, and other domains.</p><p>Not because we wanted to fit every possible field into one day, but because each works under different constraints.</p>'
        format: canvas_html_block
      text_size: normal
      text_color: default
  '0:main_slot:4:66347228-953b-4995-841b-3c43d76731bb':
    parent_uuid: a045000c-0778-48e8-b0b6-185b667ba2fd
    slot: main_slot
    uuid: 66347228-953b-4995-841b-3c43d76731bb
    component_id: sdc.event_horizon.group
    component_version: 62f65fb6a854b0dd
    inputs:
      flex_direction: column
      flex_gap: md
      items_align: start
      flex_align: center
      radius: sm
      padding: sm
  '0:main_slot:4:group_slot:0:02a69e50-ed71-4fb1-aacb-699580ce9082':
    parent_uuid: 66347228-953b-4995-841b-3c43d76731bb
    slot: group_slot
    uuid: 02a69e50-ed71-4fb1-aacb-699580ce9082
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<p>A team building for rural environments may think deeply about connectivity and limited compute. Public systems bring questions of scale, accessibility, privacy, and trust. Indian-language AI raises different challenges around data, representation and inclusion.</p><p>What might a Drupal developer learn from those constraints? What might a public-sector practitioner discover from an open-source community?</p>'
        format: canvas_html_block
      text_size: normal
      text_color: default
  '0:main_slot:4:group_slot:1:9c00af9b-8d9c-432a-b750-6f820546e195':
    parent_uuid: 66347228-953b-4995-841b-3c43d76731bb
    slot: group_slot
    uuid: 9c00af9b-8d9c-432a-b750-6f820546e195
    component_id: sdc.event_horizon.blockquote
    component_version: 508919e5073ff696
    inputs:
      text: '"Ideas travel. Sometimes the most useful answer to your own problem comes from seeing how someone in a completely different world framed theirs."'
