    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<p>When we began shaping DrupalAsia Connect India 2027, Day 1 was still an open question.</p>'
        format: canvas_html_block
      text_size: text-xl
      text_color: default
  '0:main_slot:1:group_slot:3:1ce78467-94e9-4111-b56a-e8c9df1a5261':
    parent_uuid: a7bc6f4a-eebc-4779-9b73-829cea632e73
    slot: group_slot
    uuid: 1ce78467-94e9-4111-b56a-e8c9df1a5261
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<p>AI was impossible to ignore. It was reshaping how people worked, built software and thought about technology. So dedicating the first day to AI felt natural. What was far less obvious was what that day should actually be.</p>'
        format: canvas_html_block
      text_size: normal
      text_color: default
