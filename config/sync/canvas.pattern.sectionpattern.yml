      text_color: default
      align: left
    label: 'Heading - One Drupal community, one continent'
  '0:main_slot:2:group_slot:2:dad0f1ad-b33f-47f6-abbc-21f9b032aba6':
    parent_uuid: bffde46d-3a5e-4b6d-89c1-a55fbf25a6cf
    slot: group_slot
    uuid: dad0f1ad-b33f-47f6-abbc-21f9b032aba6
    component_id: sdc.event_horizon.text
    component_version: 16c79c28a4108f9b
    inputs:
      text:
        value: '<p>The moment we began calling it an AI Summit, the conversation shifted.</p><p>A summit should offer more than a sequence of talks about the latest tools. We started asking a harder question: what should someone be able to think about differently after spending the day with us?</p><p>We did not have the answer immediately.</p><p>Most AI conversations around us were centered on GPT, prompting, generative AI and rapidly changing products. Those developments matter. They have made AI dramatically more visible and accessible. But we also felt that allowing generative AI to become the entire definition of AI would narrow the conversation too much.</p>'
        format: canvas_html_block
      text_size: normal
      text_color: default
  '0:main_slot:2:group_slot:3:931fdd9d-38a7-4ed0-860f-bb1bd0b9e90c':
    parent_uuid: bffde46d-3a5e-4b6d-89c1-a55fbf25a6cf
    slot: group_slot
    uuid: 931fdd9d-38a7-4ed0-860f-bb1bd0b9e90c
    component_id: sdc.event_horizon.blockquote
    component_version: 508919e5073ff696
    inputs:
      text: '"Place generative AI in context rather than making it the whole context."'
