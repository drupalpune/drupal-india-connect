css:
  original: |

    /**
     * DrupalAsia Connect — Speaker Card
     *
     * Based on:
     * drupal_india_connect:people-card
     *
     * Includes all base styles and AI Summit extensions.
     */

    /* =========================================
       1. CARD CONTAINER
       ========================================= */

    .people-card.dac-speaker-card {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp0-75, 0.75rem);

      width: 100%;
      height: 100%;
      min-width: 0;

      padding:
        var(--sp2, 2rem)
        var(--sp1-5, 1.5rem);

      text-align: center;
      border: solid 2px transparent;
      border-radius: 0.75rem;

      background:
        linear-gradient(
          var(--color--white, #fff),
          var(--color--white, #fff)
        ) padding-box,
        linear-gradient(
          135deg,
          color-mix(
            in srgb,
            var(--primary, #0678be) 45%,
            var(--color--white, #fff)
          ),
          color-mix(
            in srgb,
            var(--secondary, #f18b35) 45%,
            var(--color--white, #fff)
          )
        ) border-box;

      box-shadow:
        0 1px 2px rgb(0 0 0 / 0.06),
        0 1px 3px rgb(0 0 0 / 0.1);
    }

    /* =========================================
       2. SPEAKER AVATAR
       ========================================= */

    .dac-speaker-card .people-card__avatar {
      flex-shrink: 0;
      width: 8rem;
      height: 8rem;

      overflow: hidden;
      border-radius: 50%;
      background-color:
        var(--color--sky-94, #e5f3fc);
    }

    .dac-speaker-card .people-card__avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .dac-speaker-card .people-card__avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      color: var(--color--night-5, #14213d);
      font-weight: 700;
      font-size: 2.5rem;
    }

    /* =========================================
       3. CARD BODY
       ========================================= */

    .dac-speaker-card .people-card__body {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;

      gap: var(--sp0-25, 0.25rem);
      width: 100%;
      min-width: 0;
    }

    /* =========================================
       4. NAME & DESIGNATION
       ========================================= */

    .dac-speaker-card .people-card__name {
      margin: 0;

      color: var(--color--night-5, #14213d);
      font-weight: 700;
      font-size: 1.125rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .dac-speaker-card .people-card__designation {
      margin: 0;

      color: var(--color--night-50, #566273);
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* =========================================
       5. AI DOMAIN
       ========================================= */

    .dac-speaker-card__domain {
      display: inline-block;
      max-width: 100%;

      margin-top: var(--sp0-75, 0.75rem);
      padding: 0.375rem 0.75rem;

      background-color:
        var(--color--sky-94, #e5f3fc);

      color: var(--color--night-5, #14213d);

      border-radius: 0.375rem;

      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    /* =========================================
       6. DESCRIPTION
       ========================================= */

    .dac-speaker-card .people-card__description {
      margin-top: var(--sp0-25, 0.25rem);

      color: var(--color--night-30, #344054);
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.5;
    }

    .dac-speaker-card .people-card__description p,
    .dac-speaker-card .people-card__description ul,
    .dac-speaker-card .people-card__description ol {
      margin: 0;
    }

    .dac-speaker-card
    .people-card__description > * + * {
      margin-top: var(--sp0-5, 0.5rem);
    }

    .dac-speaker-card
    .people-card__description ul,
    .dac-speaker-card
    .people-card__description ol {
      padding-left: 1.25rem;
      text-align: left;
    }

    .dac-speaker-card
    .people-card__description li + li {
      margin-top: var(--sp0-25, 0.25rem);
    }

    .dac-speaker-card
    .people-card__description .text-align-left {
      text-align: left;
    }

    .dac-speaker-card
    .people-card__description .text-align-center {
      text-align: center;
    }

    .dac-speaker-card
    .people-card__description .text-align-right {
      text-align: right;
    }

    .dac-speaker-card
    .people-card__description .text-align-justify {
      text-align: justify;
    }

    .dac-speaker-card
    .people-card__description a {
      color: var(--secondary, #0678be);

      text-decoration: underline;
      text-decoration-color: color-mix(
        in srgb,
        var(--secondary, #0678be) 40%,
        transparent
      );
    }

    .dac-speaker-card
    .people-card__description a:hover {
      text-decoration-color: currentColor;
    }

    .dac-speaker-card
    .people-card__description a:focus-visible {
      outline: solid 2px
        var(--focus-ring-color, #0678be);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* =========================================
       7. SESSION DETAILS
       ========================================= */

    .dac-speaker-card__session {
      width: 100%;

      margin-top: var(--sp1, 1rem);
      padding-top: var(--sp1, 1rem);

      border-top: 1px solid
        color-mix(
          in srgb,
          var(--color--night-50, #566273) 20%,
          transparent
        );
    }

    .dac-speaker-card__session-label {
      display: block;

      color: var(--secondary, #f18b35);

      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dac-speaker-card__session p {
      margin: var(--sp0-25, 0.25rem) 0 0;

      color: var(--color--night-5, #14213d);

      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.5;
    }

    /* =========================================
       8. PROFILE LINKS
       ========================================= */

    .dac-speaker-card .people-card__links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;

      gap: var(--sp0-5, 0.5rem);

      margin-top: auto;
      padding-top: var(--sp0-75, 0.75rem);
    }

    .dac-speaker-card .people-card__link {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 2rem;
      height: 2rem;
      flex-shrink: 0;

      color: var(--color--white, #fff);
      border-radius: 50%;

      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .dac-speaker-card .people-card__link-icon {
      display: block;
      width: 0.9rem;
      height: 1.14rem;
    }

    .dac-speaker-card
    .people-card__link--drupal {
      background-color: #0678be;
    }

    .dac-speaker-card
    .people-card__link--drupal:hover {
      background-color: color-mix(
        in lab,
        #0678be 80%,
        black 20%
      );
    }

    .dac-speaker-card
    .people-card__link--linkedin {
      background-color: #0a66c2;
    }

    .dac-speaker-card
    .people-card__link--linkedin:hover {
      background-color: color-mix(
        in lab,
        #0a66c2 80%,
        black 20%
      );
    }

    .dac-speaker-card
    .people-card__link:focus-visible {
      outline: solid 2px
        var(--focus-ring-color, #0678be);
      outline-offset: 3px;
    }

    /* =========================================
       9. RESPONSIVE BEHAVIOUR
       ========================================= */

    /* Match the original component's
       container-aware heading size. */

    @container style(--md: true) {
      .dac-speaker-card .people-card__name {
        font-size: 1.25rem;
      }
    }

    /* Narrow card containers */

    @container (max-width: 280px) {
      .people-card.dac-speaker-card {
        padding: 1.25rem 0.75rem;
      }

      .dac-speaker-card .people-card__avatar {
        width: 6rem;
        height: 6rem;
      }

      .dac-speaker-card .people-card__name {
        font-size: 1rem;
      }
    }

    /* Mobile viewport fallback */

    @media (max-width: 480px) {
      .people-card.dac-speaker-card {
        padding: 1.5rem 1rem;
      }

      .dac-speaker-card .people-card__name {
        font-size: 1.125rem;
      }
    }

    /* =========================================
       10. REDUCED MOTION
       ========================================= */

    @media (prefers-reduced-motion: reduce) {
      .dac-speaker-card .people-card__link {
        transition: none;
      }
    }
