js:
  original: |

    /**
     * DrupalAsia Connect — Speaker Card
     * Adapted from drupal_india_connect:people-card
     */

    export default function SpeakerCard({
      avatar = null,
      name = "Speaker Name",
      designation = "",
      description = "",
      domain = "",
      session_title = "",
      drupal_url = "",
      linkedin_url = "",
    }) {
      const imageSrc =
        typeof avatar === "string"
          ? avatar
          : avatar?.src || "";

      const imageAlt =
        typeof avatar === "object" && avatar?.alt
          ? avatar.alt
          : name;

      const initial = name
        ? name.charAt(0).toUpperCase()
        : "";

      return (
        <article className="people-card dac-speaker-card">
          <div className="people-card__avatar">
            {imageSrc ? (
              <img
                src={imageSrc}
                alt={imageAlt}
                width={avatar?.width || 128}
                height={avatar?.height || 128}
                className="people-card__avatar-image"
                loading="lazy"
              />
            ) : (
              <span
                className="people-card__avatar-fallback"
                aria-hidden="true"
              >
                {initial}
              </span>
            )}
          </div>

          <div className="people-card__body">
            {name && (
              <h3 className="people-card__name">
                {name}
              </h3>
            )}

            {designation && (
              <p className="people-card__designation">
                {designation}
              </p>
            )}

            {domain && (
              <span className="dac-speaker-card__domain">
                {domain}
              </span>
            )}

            {description && (
              <div className="people-card__description">
                {description}
              </div>
            )}

            {session_title && (
              <div className="dac-speaker-card__session">
                <span className="dac-speaker-card__session-label">
                  SESSION
                </span>
                <p>{session_title}</p>
              </div>
            )}

            {(drupal_url || linkedin_url) && (
              <div className="people-card__links">
                {drupal_url && (
                  <a
                    href={drupal_url}
                    className="people-card__link people-card__link--drupal"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label={`View ${name} on Drupal.org`}
                  >
                    <svg
                      viewBox="0 0 142 180"
                      fill="currentColor"
                      className="people-card__link-icon"
                      aria-hidden="true"
                    >
                      <path d="M71 0C62 23 13 63 4 99c-13 51 26 81 67 81s80-30 67-81C129 63 80 23 71 0Z" />
                    </svg>
                  </a>
                )}

                {linkedin_url && (
                  <a
                    href={linkedin_url}
                    className="people-card__link people-card__link--linkedin"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label={`View ${name} on LinkedIn`}
                  >
                    <svg
                      viewBox="0 0 24 24"
                      fill="currentColor"
                      width="16"
                      height="16"
                      aria-hidden="true"
                    >
                      <path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52C22 2.68 21.31 2 20.45 2ZM7.93 18.75H4.98V9.2h2.95v9.55ZM6.45 7.9a1.71 1.71 0 1 1 0-3.42 1.71 1.71 0 0 1 0 3.42Zm12.3 10.85H15.8v-4.64c0-1.11-.02-2.54-1.55-2.54-1.56 0-1.8 1.21-1.8 2.46v4.72H9.5V9.2h2.83v1.3h.04c.4-.75 1.36-1.55 2.8-1.55 3 0 3.58 1.98 3.58 4.55v5.25Z" />
                    </svg>
                  </a>
                )}
              </div>
            )}
          </div>
        </article>
      );
    }
